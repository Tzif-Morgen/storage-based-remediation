# This patch configures the manager to serve metrics on port 8443.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: controller-manager
  namespace: system
spec:
  template:
    spec:
      containers:
      - name: manager
        args:
        - "--metrics-bind-address=:8443"
        - "--leader-elect"
        - "--health-probe-bind-address=:8081"
        - "--enable-webhooks=false"
        ports:
        - containerPort: 8443
          name: https
          protocol: TCP
